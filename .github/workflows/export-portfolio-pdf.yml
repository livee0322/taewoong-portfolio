name: Export portfolio PDF

on:
  push:
    branches:
      - export/portfolio-pdf-main-20260904-final

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Resolve deployed portfolio URL
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "https://taewoong-portfolio.vercel.app/"
            "https://taewoong-portfolio-git-feat-portfolio-projects-livees-projects.vercel.app/"
          )
          for url in "${candidates[@]}"; do
            code=$(curl -L --max-time 30 -sS -o /tmp/portfolio-page.html -w '%{http_code}' "$url" || true)
            echo "$url -> $code"
            if [[ "$code" =~ ^2 ]]; then
              echo "SITE_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No public portfolio deployment returned 2xx" >&2
          exit 1

      - name: Install Korean fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Capture 1440px desktop long screenshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          timeout 120 "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-features=LazyImageLoading,LazyFrameLoading \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=15000 \
            --hide-scrollbars \
            --window-size=1440,16000 \
            --screenshot="$PWD/artifacts/Lee_Taewoong_Portfolio_Website_Desktop_Long.png" \
            "$SITE_URL"
          test -s artifacts/Lee_Taewoong_Portfolio_Website_Desktop_Long.png
          file artifacts/Lee_Taewoong_Portfolio_Website_Desktop_Long.png
          ls -lh artifacts/Lee_Taewoong_Portfolio_Website_Desktop_Long.png

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-web-main-desktop-long
          path: artifacts/Lee_Taewoong_Portfolio_Website_Desktop_Long.png
          if-no-files-found: error
          retention-days: 7
